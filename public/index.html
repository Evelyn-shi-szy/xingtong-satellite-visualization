
<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta name="theme-color" content="#07111f">
    <meta name="description" content="星瞳——卫星影像可视化浏览平台课程项目">
    <link rel="icon" href="<%= BASE_URL %>favicon.svg">
    <!-- 引入 CesiumJS 自带控件样式，地图、按钮和弹窗才能正确显示。 -->
    <link rel="stylesheet" href="<%= BASE_URL %>cesium/Widgets/widgets.css">
    <title>星瞳 | 卫星影像可视化浏览平台</title>
  </head>
  <body>
    <noscript>本平台需要启用 JavaScript 才能运行。</noscript>
    <div id="app"></div>
    <script>
      // Cesium 通过该变量查找 Workers、Assets 等静态资源。
      window.CESIUM_BASE_URL = '<%= BASE_URL %>cesium/'
    </script>
    <!-- 先加载 CesiumJS 运行库，ImageryView 初始化时再读取 window.Cesium。 -->
    <script src="<%= BASE_URL %>cesium/Cesium.js"></script>
  </body>
</html>
